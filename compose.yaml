services:
  er-diagram:
    build:
      context: .
      dockerfile: Dockerfile
    image: er-diagram:local
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - er-diagram-data:/data
    mem_limit: 2g
    pids_limit: 128
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    stop_signal: SIGTERM
    stop_grace_period: 35s

volumes:
  er-diagram-data:
