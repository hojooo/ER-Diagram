name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate without publishing
        required: true
        default: main
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.32.1"
  IMAGE_REPOSITORY: ghcr.io/hojooo/er-diagram
  SBOM_GENERATOR: docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      publish_latest: ${{ steps.identity.outputs.publish_latest }}
    steps:
      - name: Check out requested release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and source ancestry
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          version="0.0.0"
          publish_latest="false"
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "RELEASE_VERSION_TAG_INVALID" >&2
              exit 1
            fi
            version="${REF_NAME#v}"
            git fetch origin main --no-tags
            if ! git merge-base --is-ancestor "$revision" origin/main; then
              echo "RELEASE_TAG_NOT_ON_MAIN" >&2
              exit 1
            fi
            highest=""
            while IFS= read -r candidate; do
              if [[ "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                highest="$candidate"
                break
              fi
            done < <(git tag --list 'v*' --sort=-v:refname)
            if [[ "$highest" == "$REF_NAME" ]]; then publish_latest="true"; fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run repository release gate
        run: pnpm ci:verify
      - name: Install Chromium and stable Chrome for Playwright
        run: pnpm exec playwright install --with-deps chromium chrome
      - name: Run end-to-end acceptance tests
        run: pnpm test:e2e
      - name: Run accessibility acceptance
        run: pnpm test:accessibility
      - name: Run packaged container acceptance
        run: pnpm test:container
      - name: Run production lifecycle acceptance
        run: pnpm test:runtime-lifecycle
      - name: Run Milestone 1 acceptance gate
        run: pnpm test:m1-gate
      - name: Run Milestone 2 acceptance gate
        run: pnpm test:m2-gate
      - name: Run Milestone 3 acceptance gate
        run: pnpm test:m3-gate
      - name: Run complete P0 production acceptance
        run: pnpm test:p0-gate
      - name: Run production performance acceptance
        run: pnpm test:perf

  dry-run-image:
    name: Build and inspect multi-architecture image without publishing
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out requested release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build, inspect, and execute both platform images
        run: pnpm test:release

  publish-image:
    name: Publish immutable GHCR image and GitHub Release
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install dependencies for release evidence
        run: pnpm install --frozen-lockfile
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.publish_latest == 'true' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.revision }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=DBML SQL ERD Studio
            org.opencontainers.image.description=Self-hosted DBML and SQL schema workspace
          annotations: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.revision }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=DBML SQL ERD Studio
            org.opencontainers.image.description=Self-hosted DBML and SQL schema workspace
      - name: Check immutable version tag
        id: preflight
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          set -euo pipefail
          reference="${IMAGE_REPOSITORY}:${VERSION}"
          if docker buildx imagetools inspect "$reference" >/dev/null 2>&1; then
            if ! node scripts/check-release-remote.mjs "$reference" "$VERSION" "$REVISION" > "$RUNNER_TEMP/existing-image.json" 2>/dev/null; then
              echo "RELEASE_IMAGE_TAG_CONFLICT" >&2
              exit 1
            fi
            digest="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1], "utf8")); process.stdout.write(value.digest)' "$RUNNER_TEMP/existing-image.json")"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare deterministic CycloneDX and EPL evidence
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          set -euo pipefail
          node scripts/prepare-release-sbom-assets.mjs application \
            --output "$RUNNER_TEMP/release-assets" \
            --version "$VERSION" \
            --revision "$REVISION" \
            --image-reference "${IMAGE_REPOSITORY}:$VERSION"
      - name: Build and push exact multi-architecture tags
        id: build
        if: steps.preflight.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=registry,oci-mediatypes=true,oci-artifact=true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: false
          sbom: generator=${{ env.SBOM_GENERATOR }}
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_REVISION=${{ needs.validate.outputs.revision }}
            OCI_VERSION=${{ needs.validate.outputs.version }}
            RUNTIME_RELEASE_CHANNEL=RELEASE
            RUNTIME_RELEASE_VERSION=${{ needs.validate.outputs.version }}
            RUNTIME_RELEASE_SOURCE_REVISION=${{ needs.validate.outputs.revision }}
            RUNTIME_RELEASE_IMAGE_REFERENCE=${{ env.IMAGE_REPOSITORY }}:${{ needs.validate.outputs.version }}
      - name: Verify published index and floating latest policy
        id: evidence
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
          PUBLISH_LATEST: ${{ needs.validate.outputs.publish_latest }}
        run: |
          set -euo pipefail
          reference="${IMAGE_REPOSITORY}:${VERSION}"
          node scripts/check-release-remote.mjs "$reference" "$VERSION" "$REVISION" > "$RUNNER_TEMP/release-image.json"
          digest="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1], "utf8")); process.stdout.write(value.digest)' "$RUNNER_TEMP/release-image.json")"
          if [[ "${{ steps.preflight.outputs.exists }}" == "true" && "$digest" != "${{ steps.preflight.outputs.digest }}" ]]; then
            echo "RELEASE_IMAGE_TAG_CONFLICT" >&2
            exit 1
          fi
          if [[ "$PUBLISH_LATEST" == "true" ]]; then
            node scripts/check-release-remote.mjs "${IMAGE_REPOSITORY}:latest" "$VERSION" "$REVISION" > "$RUNNER_TEMP/latest-image.json"
            latest_digest="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1], "utf8")); process.stdout.write(value.digest)' "$RUNNER_TEMP/latest-image.json")"
            if [[ "$latest_digest" != "$digest" ]]; then
              echo "RELEASE_LATEST_TAG_CONFLICT" >&2
              exit 1
            fi
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Extract and verify release SBOM assets
        id: sbom-assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
          DIGEST: ${{ steps.evidence.outputs.digest }}
        run: |
          set -euo pipefail
          reference="${IMAGE_REPOSITORY}@$DIGEST"
          node scripts/prepare-release-sbom-assets.mjs remote-spdx \
            --output "$RUNNER_TEMP/release-assets" \
            --version "$VERSION" \
            --reference "$reference"
          node scripts/prepare-release-sbom-assets.mjs finalize \
            --output "$RUNNER_TEMP/release-assets" \
            --version "$VERSION" \
            --revision "$REVISION" \
            --image-reference "${IMAGE_REPOSITORY}:$VERSION" \
            > "$RUNNER_TEMP/release-sbom-evidence.json"
          cyclonedx_sha="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1], "utf8")); process.stdout.write(value.cyclonedxSha256)' "$RUNNER_TEMP/release-sbom-evidence.json")"
          sha256sums_sha="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1], "utf8")); process.stdout.write(value.sha256sumsSha256)' "$RUNNER_TEMP/release-sbom-evidence.json")"
          elk_license_sha="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1], "utf8")); process.stdout.write(value.elkLicenseSha256)' "$RUNNER_TEMP/release-sbom-evidence.json")"
          echo "cyclonedx_sha=$cyclonedx_sha" >> "$GITHUB_OUTPUT"
          echo "elk_license_sha=$elk_license_sha" >> "$GITHUB_OUTPUT"
          echo "sha256sums_sha=$sha256sums_sha" >> "$GITHUB_OUTPUT"
      - name: Execute both published platform images
        run: >-
          node scripts/check-release-runtime.mjs
          "${IMAGE_REPOSITORY}@${{ steps.evidence.outputs.digest }}"
          "${{ needs.validate.outputs.version }}"
          "${{ needs.validate.outputs.revision }}"
          "${{ steps.sbom-assets.outputs.cyclonedx_sha }}"
          "${{ steps.sbom-assets.outputs.elk_license_sha }}"
      - name: Verify anonymous immutable digest pull
        run: |
          set -euo pipefail
          docker logout ghcr.io
          if ! docker pull "${IMAGE_REPOSITORY}@${{ steps.evidence.outputs.digest }}"; then
            echo "RELEASE_IMAGE_NOT_PUBLIC" >&2
            exit 1
          fi
      - name: Create or verify GitHub Release evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
          DIGEST: ${{ steps.evidence.outputs.digest }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            '## 배포 증거' \
            '' \
            "- source commit: \`$REVISION\`" \
            "- image tag: \`${IMAGE_REPOSITORY}:$VERSION\`" \
            "- immutable digest: \`$DIGEST\`" \
            '- platforms: `linux/amd64`, `linux/arm64`' \
            "- CycloneDX SHA-256: \`${{ steps.sbom-assets.outputs.cyclonedx_sha }}\`" \
            "- SHA256SUMS SHA-256: \`${{ steps.sbom-assets.outputs.sha256sums_sha }}\`" \
            '' \
            '## 공급망 증거' \
            '' \
            "- application SBOM: \`er-diagram-$VERSION.cdx.json\`" \
            "- platform SBOM: \`er-diagram-$VERSION-linux-amd64.spdx.json\`, \`er-diagram-$VERSION-linux-arm64.spdx.json\`" \
            '- EPL source: `elkjs-0.12.0-source.tgz`' \
            '- checksums: `SHA256SUMS`' \
            '' \
            '## 실행' \
            '' \
            "\`\`\`sh" \
            "docker pull ${IMAGE_REPOSITORY}@$DIGEST" \
            "\`\`\`" > "$body"
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing="$RUNNER_TEMP/existing-release.md"
            existing_assets="$RUNNER_TEMP/existing-release-assets"
            mkdir -p "$existing_assets"
            gh release view "$TAG" --json body --jq .body > "$existing"
            grep -Fq "$REVISION" "$existing" || { echo "RELEASE_GITHUB_RELEASE_CONFLICT" >&2; exit 1; }
            grep -Fq "$DIGEST" "$existing" || { echo "RELEASE_GITHUB_RELEASE_CONFLICT" >&2; exit 1; }
            grep -Fq "${IMAGE_REPOSITORY}:$VERSION" "$existing" || { echo "RELEASE_GITHUB_RELEASE_CONFLICT" >&2; exit 1; }
            gh release download "$TAG" --dir "$existing_assets"
            node scripts/prepare-release-sbom-assets.mjs compare \
              --expected "$RUNNER_TEMP/release-assets" \
              --actual "$existing_assets"
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "DBML SQL ERD Studio $TAG" \
              --notes-file "$body" \
              "$RUNNER_TEMP/release-assets"/*
          fi
          printf 'Immutable image: `%s@%s`\n' "$IMAGE_REPOSITORY" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
