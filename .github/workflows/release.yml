name: Release dry run

# Milestone 0 intentionally validates release readiness without publishing an image.
# GHCR authentication, multi-platform builds, and pushes belong to M4-009.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ inputs.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.32.1"

jobs:
  validate:
    name: Validate release candidate without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out requested ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm through Corepack
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the repository release gate
        run: pnpm ci:verify
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end acceptance tests
        run: pnpm test:e2e
      - name: Run the Milestone 0 layout performance gate
        run: pnpm test:perf -- --scenario layout-spike
